name: Clinical angle checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-clinical-angles:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy

      - name: Compile source
        run: python -m compileall src

      - name: Verify clinical angle conventions
        run: python tests/verify_clinical_angles_portable.py
